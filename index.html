<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ryrach Systems | Software Built for Real Businesses</title>
    <meta
      name="description"
      content="Ryrach Systems builds practical SaaS, business software, identity verification solutions, hotel management systems, school management systems and custom digital platforms."
    />
    <link rel="canonical" href="https://ryrachsystems.com/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#06070c" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ryrach Systems" />
    <meta property="og:title" content="Ryrach Systems | Software Built for Real Businesses" />
    <meta
      property="og:description"
      content="Practical SaaS, business software, identity verification, hotel management, school management systems and custom digital platforms."
    />
    <meta property="og:url" content="https://ryrachsystems.com/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ryrach Systems | Software Built for Real Businesses" />
    <meta
      name="twitter:description"
      content="Practical SaaS, business software, identity verification, hotel management, school management systems and custom digital platforms."
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Ryrach Systems",
        "slogan": "Software built for real businesses.",
        "url": "https://ryrachsystems.com",
        "description": "Ryrach Systems develops practical software, SaaS platforms, APIs and digital business systems.",
        "address": { "@type": "PostalAddress", "addressCountry": "MW" }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div hidden>
      <form name="demo-request" data-netlify="true" netlify-honeypot="bot-field">
        <input type="hidden" name="form-name" value="demo-request" />
        <input name="bot-field" />
        <input name="fullName" /><input name="email" /><input name="phone" />
        <input name="company" /><input name="country" /><input name="product" />
        <input name="users" /><input name="message" />
      </form>
      <form name="software-order" data-netlify="true" netlify-honeypot="bot-field">
        <input type="hidden" name="form-name" value="software-order" />
        <input name="bot-field" />
        <input name="fullName" /><input name="company" /><input name="email" />
        <input name="phone" /><input name="country" /><input name="product" />
        <input name="requestType" /><input name="deployment" /><input name="users" />
        <input name="requirements" /><input name="budget" /><input name="additional" />
      </form>
      <form name="developer-request" data-netlify="true" netlify-honeypot="bot-field">
        <input type="hidden" name="form-name" value="developer-request" />
        <input name="bot-field" />
        <input name="fullName" /><input name="company" /><input name="email" />
        <input name="productApi" /><input name="useCase" /><input name="volume" />
        <input name="techContact" /><input name="message" />
      </form>
      <form name="contact-message" data-netlify="true" netlify-honeypot="bot-field">
        <input type="hidden" name="form-name" value="contact-message" />
        <input name="bot-field" />
        <input name="fullName" /><input name="email" /><input name="phone" />
        <input name="company" /><input name="reason" /><input name="message" />
      </form>
      <form name="job-application" data-netlify="true" netlify-honeypot="bot-field">
        <input type="hidden" name="form-name" value="job-application" />
        <input name="bot-field" />
        <input name="fullName" /><input name="email" /><input name="phone" />
        <input name="location" /><input name="portfolio" /><input name="position" />
        <input name="years" /><input name="coverLetter" /><input name="additional" />
        <input type="file" name="cv" />
      </form>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
